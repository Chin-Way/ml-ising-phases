[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-ising-phases"
version = "0.1.0"
description = "2-D Ising Monte Carlo and a neural network that learns the phase transition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scikit-learn>=1.2", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["ising"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
